<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>notes</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="terminal" id="terminal">
    <div class="titlebar">
      <span class="dot dot-red"></span>
      <span class="dot dot-yellow"></span>
      <span class="dot dot-green"></span>
      <span class="titlebar-title">claude — notes — 80×24</span>
    </div>

    <div class="scrollback" id="scrollback">
      <div class="banner">
        <div class="banner-line banner-top">✻ Welcome to Claude Code!</div>
        <div class="banner-line">&nbsp;</div>
        <div class="banner-line">&nbsp;&nbsp;/help for help, /status for your current setup</div>
        <div class="banner-line">&nbsp;</div>
        <div class="banner-line">&nbsp;&nbsp;cwd: <span id="cwd">~/notes</span></div>
      </div>
    </div>

    <div class="composer">
      <div class="prompt-box" id="promptBox">
        <span class="chevron">&gt;</span>
        <div class="input" id="input" contenteditable="true" data-placeholder="Write a note, then press Enter…"></div>
      </div>
      <div class="hint-row">
        <span class="hint-left" id="hintLeft">? for shortcuts</span>
        <span class="hint-right" id="hintRight"><span id="noteCount">0</span> notes</span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
